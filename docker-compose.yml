services:
  # 0. RabbitMQ - Message Broker
  rabbitmq:
    image: rabbitmq:3-management
    container_name: ddbms_rabbitmq
    ports:
      - "5672:5672"   # Cổng kết nối AMQP cho Node.js
      - "15672:15672" # Cổng Dashboard UI quản lý
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # 1. SQL Server - Central Node
  sql-central:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddbms_sql_central
    ports:
      - "1404:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./database:/usr/config
      - sql-central-data:/var/opt/mssql
    entrypoint: >
      bash -c "cp /usr/config/init/init-central.sh /tmp/init-central.sh && sed -i 's/\r$$//' /tmp/init-central.sh && bash /tmp/init-central.sh & /opt/mssql/bin/sqlservr"

  # 2. SQL Server - Hanoi Node
  sql-hanoi:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddbms_sql_hanoi
    ports:
      - "1403:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./database:/usr/config
      - sql-hanoi-data:/var/opt/mssql
    entrypoint: >
      bash -c "cp /usr/config/init/init-hanoi.sh /tmp/init-hanoi.sh && sed -i 's/\r$$//' /tmp/init-hanoi.sh && bash /tmp/init-hanoi.sh & /opt/mssql/bin/sqlservr"

  # 3. SQL Server - Hue Node
  sql-hue:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddbms_sql_hue
    ports:
      - "1401:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./database:/usr/config
      - sql-hue-data:/var/opt/mssql
    entrypoint: >
      bash -c "cp /usr/config/init/init-hue.sh /tmp/init-hue.sh && sed -i 's/\r$$//' /tmp/init-hue.sh && bash /tmp/init-hue.sh & /opt/mssql/bin/sqlservr"

  # 4. SQL Server - Saigon Node
  sql-saigon:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ddbms_sql_saigon
    ports:
      - "1402:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - ./database:/usr/config
      - sql-saigon-data:/var/opt/mssql
    entrypoint: >
      bash -c "cp /usr/config/init/init-saigon.sh /tmp/init-saigon.sh && sed -i 's/\r$$//' /tmp/init-saigon.sh && bash /tmp/init-saigon.sh & /opt/mssql/bin/sqlservr"

  # 5. Node.js Backend
  backend:
    build: ./backend
    container_name: ddbms_backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=8h
      - AUTH_COOKIE_NAME=ddbm_auth
      - FRONTEND_ORIGIN=http://localhost:3000
      - DEFAULT_RESET_PASSWORD=${DEFAULT_RESET_PASSWORD:-123456}
      - TZ=Asia/Ho_Chi_Minh

      # EMAIL CONFIG
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_PORT=587
      - EMAIL_USER=kimvinh869@gmail.com
      - EMAIL_PASS=${EMAIL_PASS}
      - EMAIL_FROM_NAME="Hệ thống Cửa hàng tiện lợi"
      - EMAIL_FROM_ADDRESS=kimvinh869@gmail.com

      # CENTRAL DB
      - CENTRAL_DB_HOST=sql-central
      - CENTRAL_DB_PORT=1433
      - CENTRAL_DB_USER=sa
      - CENTRAL_DB_PASSWORD=${MSSQL_SA_PASSWORD}
      - CENTRAL_DB_NAME=CentralDB

      # HANOI DB
      - HANOI_DB_HOST=sql-hanoi
      - HANOI_DB_PORT=1433
      - HANOI_DB_USER=sa
      - HANOI_DB_PASSWORD=${MSSQL_SA_PASSWORD}
      - HANOI_DB_NAME=Store_HN

      # HUE DB
      - HUE_DB_HOST=sql-hue
      - HUE_DB_PORT=1433
      - HUE_DB_USER=sa
      - HUE_DB_PASSWORD=${MSSQL_SA_PASSWORD}
      - HUE_DB_NAME=Store_H

      # SAIGON DB
      - SAIGON_DB_HOST=sql-saigon
      - SAIGON_DB_PORT=1433
      - SAIGON_DB_USER=sa
      - SAIGON_DB_PASSWORD=${MSSQL_SA_PASSWORD}
      - SAIGON_DB_NAME=Store_SG
      # RABBITMQ
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672

    depends_on:
      - rabbitmq
      - sql-central
      - sql-hanoi
      - sql-hue
      - sql-saigon

  # 6. Next.js Frontend
  frontend:
    build: ./frontend
    container_name: ddbms_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=http://localhost:3001
    depends_on:
      - backend

# Named volumes — giữ data DB khi container bị xóa (docker compose down)
volumes:
  sql-central-data:
  sql-hanoi-data:
  sql-hue-data:
  sql-saigon-data:
  rabbitmq-data:
